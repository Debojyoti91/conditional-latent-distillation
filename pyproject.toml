[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conditional-latent-distillation"
version = "0.1.0"
description = "Reproducible surfactant and anion-exchange-membrane research workflows"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.4", "rdkit==2025.9.1", "matplotlib>=3.8", "seaborn>=0.13", "joblib>=1.3", "Pillow>=10", "openpyxl>=3", "shapely>=2"]

[project.optional-dependencies]
research = ["torch>=2.3", "torch-geometric>=2.5", "botorch>=0.12", "gpytorch>=1.13", "selfies>=2.1", "umap-learn>=0.5", "hdbscan>=0.8", "tqdm>=4.66", "pyyaml>=6"]
notebooks = ["jupyterlab>=4"]
dev = ["pytest>=8", "black>=24", "build>=1"]

[project.scripts]
latent-materials = "latent_materials.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latent_materials = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 88
